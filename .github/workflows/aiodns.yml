name: AioDNS regression tests
on:
  push:
    paths:
      - 'Other/aiodns/**'
      - 'Netch/Interops/AioDNS.cs'
      - 'Netch/Controllers/DNSController.cs'
      - '.github/workflows/aiodns.yml'
  pull_request:
    paths:
      - 'Other/aiodns/**'
      - 'Netch/Interops/AioDNS.cs'
      - 'Netch/Controllers/DNSController.cs'
      - '.github/workflows/aiodns.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.18.10'
          cache-dependency-path: Other/aiodns/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          install: mingw-w64-x86_64-gcc
      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = Join-Path $Env:MSYS2_ROOT 'mingw64\bin'
          $mingw | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$(Join-Path $mingw 'gcc.exe')" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test native lifecycle and error paths
        working-directory: Other/aiodns
        run: go test -race -count=1 -timeout=60s ./...
      - name: Build shared library
        working-directory: Other/aiodns
        run: go build -buildmode=c-shared -o aiodns.bin .
      - name: Test actual C# P/Invoke and controller
        shell: pwsh
        run: |
          $nativeArgs = @((Join-Path $PWD 'Other/aiodns/aiodns.bin'))
          if ($IsWindows) { $nativeArgs += (Join-Path $PWD 'Storage/tun2socks.bin') }
          dotnet run --project Other/aiodns/interop-tests --configuration Release -- @nativeArgs
